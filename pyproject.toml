[project]
name = "loop-hooks"
version = "0.4.0"
description = "Change-gated verification for Claude Code: run your verify command at end of turn, but only when something actually changed"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.8",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.pyright]
include = ["hooks", "scripts"]
strict = ["hooks", "scripts"]
pythonVersion = "3.10"

[tool.ruff]
line-length = 100
# ruff format は Markdown の fenced code も整形対象にする。docs は対象外
extend-exclude = ["docs"]

[tool.ruff.lint]
# E402 を有効にすることで、hooks/ を import path に足すための sys.path.insert より
# 後ろに置いた import に付けた `# noqa: E402` が意味を持つ。
# S(flake8-bandit): subprocess の呼出箇所を明示的に受け入れる(行単位 noqa + 理由)。
select = ["E", "F", "I", "W", "S"]

[tool.ruff.lint.per-file-ignores]
# assert はテストの本質。S603 はテストが git を argv リストで呼ぶ箇所(ユーザー入力なし)。
"tests/*" = ["S101", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.importlinter]
# 対象は hooks 名前空間パッケージ(__init__.py は作らない。PEP 420)。実行はリポジトリルートで
# PYTHONPATH=.(第 3 段階で lib 起点から hooks 起点に変更。mutmut の変異キーと合わせるため)。
root_packages = ["hooks"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "lib は入口(gate / session_start)を import しない"
type = "forbidden"
source_modules = ["hooks.lib"]
forbidden_modules = ["hooks.gate", "hooks.session_start"]

[[tool.importlinter.contracts]]
name = "subprocess を使うのは fingerprint だけ"
type = "forbidden"
source_modules = ["hooks.lib.config", "hooks.lib.hook_io", "hooks.lib.log", "hooks.lib.state", "hooks.lib.status"]
forbidden_modules = ["subprocess"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "lib の層(上が下に依存する)"
type = "layers"
layers = ["status", "log", "config", "fingerprint", "state", "hook_io"]
containers = ["hooks.lib"]
