[project]
name = "loop-hooks"
version = "0.3.0"
description = "Change-gated verification for Claude Code: run your verify command at end of turn, but only when something actually changed"
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E402 を有効にすることで、hooks/ を import path に足すための sys.path.insert より
# 後ろに置いた import に付けた `# noqa: E402` が意味を持つ。
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
